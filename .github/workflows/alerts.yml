name: Alerty Telegram

on:
  schedule:
    - cron: '17 * * * *'   # co godzinę; raport dzienny o REPORT_HOUR_UTC (domyślnie 7 UTC = 8:00 zimą w Polsce)
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Wyślij raport dzienny teraz'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sprawdź rynek i wyślij alerty
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUDGET: ${{ vars.BUDGET }}
          WEIGHTS: ${{ vars.WEIGHTS }}
          REPORT_HOUR_UTC: ${{ vars.REPORT_HOUR_UTC }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_report }}
        run: node scripts/alert.mjs
      - name: Zapisz stan alertów
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "buy-score-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Stan alertów [skip ci]"
            git push
          fi
